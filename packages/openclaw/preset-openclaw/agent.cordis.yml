# ClawDSH「openclaw」agent preset —— agent-plane 组合，挂载于单个 agent 作用域。
# 阶段 0 Spike：验证 soul 行在 preset 场景下的挂载形态。
# 阶段 2 会在此基础上叠加渠道行与完整 openclaw 能力（见 docs/specs/roadmap.md）。

- id: soul
  name: '@clawdsh/dsh-soul'
  config:
    # 相对 source 按挂载树 baseUrl（本 preset 的组合目录）解析；
    # copyComposition 会把 souls/ 目录随 preset 一起复制。
    source: ./souls/assistant.md
    mode: append
