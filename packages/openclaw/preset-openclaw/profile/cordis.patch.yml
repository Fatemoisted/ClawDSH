# ClawDSH「clawdsh」profile 层（复制到 $DSH_HOME/profiles/clawdsh/ 后生效）。
# 格式：顶层 YAML 数组的 loader patch entries（覆盖既有行 / insert 新行）。
# 干净安装默认关闭通信 sidecar 与 Automation，确保无外部凭据时 GUI 仍可启动。

- id: system-prompt
  config:
    persona: >-
      You are a personal AI assistant.

- insert:
    # OpenClaw 独占平台凭据、准入和投递；DSH 独占 Agent、Session、工具与审批。
    # 旧 Telegram/Feishu adapter 不再出现在 profile 中。切换前须先停掉旧登录，避免同一账号双登录。
    - id: clawdsh-communication-plane
      name: cordis:group
      group: true
      disabled: !!js process.env.CLAWDSH_OPENCLAW_CHANNELS_ENABLED !== '1'
      config:
        - id: channel
          name: '@clawdsh/dsh-channel'

        - id: channel-agent
          name: '@clawdsh/dsh-channel-agent'
          config:
            ownerPreset: clawdsh
            safePreset: clawdsh-messaging-safe
            cwd: !!js process.env.CLAWDSH_CHANNEL_CWD || process.cwd()
            stagingRoot: !!js process.env.CLAWDSH_OPENCLAW_STAGING_ROOT
            maxMediaBytes: 5242880
            shutdownGraceMs: 30000

        - id: channel-openclaw
          name: '@clawdsh/dsh-channel-openclaw'
          config:
            track: !!js process.env.CLAWDSH_OPENCLAW_TRACK || 'production'
            gatewayInstanceId: !!js process.env.CLAWDSH_OPENCLAW_GATEWAY_INSTANCE_ID
            artifactPath: !!js process.env.CLAWDSH_OPENCLAW_ARTIFACT_PATH
            hostRoot: !!js process.env.CLAWDSH_OPENCLAW_HOST_ROOT
            runtimeRoot: !!js process.env.CLAWDSH_OPENCLAW_RUNTIME_ROOT
            # 分离安装的 Channel 必须逐项提供 pluginId/channelIds/packageName/version/integrity/projectTree；
            # 默认空列表拒绝任何 stateDir/npm/projects 中的插件，运行时不自动安装。
            extensions: []
            nodePath: !!js process.env.CLAWDSH_OPENCLAW_NODE_PATH
            configPath: !!js process.env.CLAWDSH_OPENCLAW_CONFIG_PATH
            stateDir: !!js process.env.CLAWDSH_OPENCLAW_STATE_DIR
            stagingRoot: !!js process.env.CLAWDSH_OPENCLAW_STAGING_ROOT
            maxMediaBytes: 5242880
            endpoint: !!js process.env.CLAWDSH_OPENCLAW_ENDPOINT
            gatewayPort: 18789
            maxFrameBytes: 1048576
            maxInFlight: 32
            requestTimeoutMs: 30000
            handshakeTimeoutMs: 30000
            startupTimeoutMs: 120000
            shutdownGraceMs: 10000
            diagnosticBytes: 262144

    # memory（Markdown 记忆事实源）+ embeddings-ark（语义召回后端）。
    # embeddings-ark 缺 ARK_API_KEY 时 boot 不受影响；provider 只在调用时解析凭据并 fail-loud。
    - id: memory
      name: '@clawdsh/dsh-memory'
      config:
        root: !!js dshHomePath('memory')

    - id: embeddings-ark
      name: '@clawdsh/dsh-embeddings-ark'

    # skills-hub（ClawHub 兼容技能目录 provider）默认启用，无凭据、无安装副作用。
    - id: skills-hub
      name: '@clawdsh/dsh-skills-hub'

    # Automation 默认关闭；用户显式配置规则后再启用。
    - id: automation
      name: '@clawdsh/dsh-automation'
      disabled: true

# 新 GUI 会话默认挂载「ClawDSH 模式」preset。
- id: agent-presets
  config:
    default: clawdsh
