# ClawDSH「openclaw」profile 层（复制到 $DSH_HOME/profiles/openclaw/ 后生效）。
# 格式：顶层 YAML 数组的 loader patch entries（覆盖既有行 / insert 新行）。
# 阶段 0：把部署级默认人格换成 OpenClaw 的中性开场——验证 profile 层叠机制。
# 阶段 2：insert 渠道行（channel-core 注册表 + Telegram/飞书双适配器）。

- id: system-prompt
  config:
    persona: >-
      You are a personal AI assistant.

- insert:
    # ctx.channels 注册表 + 两个适配器。凭证（botToken / appId+appSecret）后置，
    # 全部默认 disabled；真实 e2e 前解开对应行并填 Config（凭证走 ctx.credentials/.env）。
    # 适配器 inject 'channels'，启用时须与 channel-core 同启。
    - id: channel-core
      name: '@clawdsh/dsh-channel-core'
      disabled: true

    - id: channel-telegram
      name: '@clawdsh/dsh-channel-telegram'
      disabled: true

    - id: channel-feishu
      name: '@clawdsh/dsh-channel-feishu'
      disabled: true
