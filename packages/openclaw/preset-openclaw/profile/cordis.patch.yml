# ClawDSH「openclaw」profile 层（复制到 $DSH_HOME/profiles/openclaw/ 后生效）。
# 格式：顶层 YAML 数组的 loader patch entries（覆盖既有行 / insert 新行）。
# 阶段 0：把部署级默认人格换成 OpenClaw 的中性开场——验证 profile 层叠机制。
# 阶段 2：insert 渠道行（channel-core 注册表 + Telegram/飞书双适配器）。飞书已启用（凭证走 env），
#         Telegram 保持 disabled（无账号）。

- id: system-prompt
  config:
    persona: >-
      You are a personal AI assistant.

- insert:
    # ctx.channels 注册表 + 双适配器。飞书凭证走环境变量（FEISHU_APP_ID / FEISHU_APP_SECRET），
    # 不落盘；未设置时 boot 会 fail-loud（appId/appSecret required）。适配器 inject 'channels'，
    # 启用时须与 channel-core 同启。
    - id: channel-core
      name: '@clawdsh/dsh-channel-core'

    - id: channel-telegram
      name: '@clawdsh/dsh-channel-telegram'
      disabled: true

    - id: channel-feishu
      name: '@clawdsh/dsh-channel-feishu'
      config:
        appId: !!js process.env.FEISHU_APP_ID
        appSecret: !!js process.env.FEISHU_APP_SECRET
        domain: feishu

    # 阶段 2 补漏：memory（Markdown 记忆事实源）+ embeddings-ark（语义召回后端）。
    # memory 的 root 用 dshHomePath('memory')（~/.dsh/memory）；embeddings-ark 保持 disabled——
    # 无 ARK_API_KEY 时不得影响 boot；拿到 key 后（根 .env 或 $DSH_HOME/.env）解除 disabled。
    - id: memory
      name: '@clawdsh/dsh-memory'
      config:
        root: !!js dshHomePath('memory')

    - id: embeddings-ark
      name: '@clawdsh/dsh-embeddings-ark'
      disabled: true
