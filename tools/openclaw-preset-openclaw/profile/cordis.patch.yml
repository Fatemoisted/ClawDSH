# ClawDSH「clawdsh」profile 层（复制到 $DSH_HOME/profiles/clawdsh/ 后生效）。
# 格式：顶层 YAML 数组的 loader patch entries（覆盖既有行 / insert 新行）。
# 阶段 0：把部署级默认人格换成 OpenClaw 的中性开场——验证 profile 层叠机制。
# 干净安装默认关闭飞书、Telegram、Discord 与 Automation，确保无任何外部凭据时 GUI 仍可启动。

- id: system-prompt
  config:
    persona: >-
      You are a personal AI assistant.

- insert:
    # ctx.channels 注册表 + 三个适配器。适配器干净安装时关闭；启用后，渠道通过
    # Harness credentials 解析命名引用，并以 launch environment 回退，凭证值不落盘。
    # 适配器 inject 'channels'，启用时须与 channel-core 同启；缺凭证时保持不可用并明确告警。
    # 渠道身份呈现（阶段 3）：identity 只驱动呈现（出站前缀/ack 表情/mention 正则），从不进 prompt。
    # responsePrefix 'auto' = [name]；ackReaction 缺省回退 identity.emoji → 👀。
    - id: channel-core
      name: '@clawdsh/dsh-channel-core'
      config:
        agentPreset: clawdsh
        groupMode: mention
        ackReactionScope: group-mentions
        # identity:
        #   name: ClawDSH
        #   emoji: 🐚
        responsePrefix: auto
        ackReaction: '👀'

    - id: channel-telegram
      name: '@clawdsh/dsh-channel-telegram'
      disabled: true
      config:
        botTokenEnv: TELEGRAM_BOT_TOKEN

    - id: channel-discord
      name: '@clawdsh/dsh-channel-discord'
      disabled: true
      config:
        botTokenEnv: DISCORD_BOT_TOKEN
        messageContentIntent: false

    - id: channel-feishu
      name: '@clawdsh/dsh-channel-feishu'
      disabled: true
      config:
        appIdEnv: FEISHU_APP_ID
        appSecretEnv: FEISHU_APP_SECRET
        domain: feishu

    # 阶段 2 补漏：memory（Markdown 记忆事实源）+ embeddings-ark（语义召回后端）。
    # memory 的 root 用 dshHomePath('memory')（~/.dsh/memory）。
    # embeddings-ark 缺 ARK_API_KEY 时 boot 不受影响——provider 只在 embed 调用时
    # per-call 解析凭证并 fail-loud（memory_search 报错指名该包），不会静默降级。
    - id: memory
      name: '@clawdsh/dsh-memory'
      config:
        root: !!js dshHomePath('memory')
        # watch 默认开启：宿主改动记忆文件即时失效对应索引条目（补 (version,size) 同尺寸编辑盲区）。

    - id: embeddings-ark
      name: '@clawdsh/dsh-embeddings-ark'
      config:
        apiKeyEnv: ARK_API_KEY

    # 阶段 3：skills-hub（ClawHub 兼容技能目录 provider，挂 ctx.skills 注册表）。
    # 纯增量目录合并：目录不存在即空列表、无凭证、无安装执行；默认启用。
    # 默认 managedDir 即 legacy OpenClaw 目录（~/.clawdbot/skills），存量技能开箱即用。
    - id: skills-hub
      name: '@clawdsh/dsh-skills-hub'

    # 阶段 3：automation（cron 风格定时 agent 回合）。disabled 起步（opt-in）：
    # 规则在 config.rules 声明，配置错误挂载时 fail-loud。示例：
    #   - id: automation
    #     name: '@clawdsh/dsh-automation'
    #     config:
    #       rules:
    #         - id: morning-digest
    #           schedule: { kind: cron, expr: '0 9 * * *', timeZone: Asia/Shanghai }
    #           message: Post a morning digest of the session log.
    - id: automation
      name: '@clawdsh/dsh-automation'
      disabled: true

# 阶段 4（GUI 接线）：默认 agent preset 指向 clawdsh，覆盖 web bundle 的 default: standard，
# 让 GUI 新会话自动挂上「ClawDSH 模式」preset（soul 人格 + 完整工具集）。
- id: agent-presets
  config:
    default: clawdsh
