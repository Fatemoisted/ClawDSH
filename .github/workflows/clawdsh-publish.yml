# Pack and publish the independently versioned ClawDSH family to the protected
# environment's private npm registry. Pull requests and clawdsh pushes run the
# credential-free pack/install gate; only a manual dispatch from a clawdsh-v*
# tag contained in the release branch can publish.
name: ClawDSH publish

on:
  pull_request:
    branches: [clawdsh]
  push:
    branches: [clawdsh]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified tarballs; false is a credential-free dry run
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PRIMARY_NODE_VERSION: '24'
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  pack:
    name: Pack and verify ClawDSH tarballs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Configure pnpm store path
        id: pnpm-store
        run: |
          store_root="$HOME/.local/share/pnpm/store"
          echo "PNPM_CONFIG_STORE_DIR=$store_root" >> "$GITHUB_ENV"
          store_path=$(PNPM_CONFIG_STORE_DIR="$store_root" pnpm store path --silent)
          echo "path=$store_path" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-node-${{ env.PRIMARY_NODE_VERSION }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ env.PRIMARY_NODE_VERSION }}-pnpm-

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Verify runtime dependency closure
        run: pnpm run verify-runtime-closure

      - name: Verify ClawDSH release version and profile ranges
        env:
          RELEASE_PUBLISH: ${{ inputs.publish }}
        run: pnpm run release:verify --family clawdsh

      - name: Clean generated outputs
        run: pnpm run clean

      - name: Build
        run: pnpm run build

      - name: Pack ClawDSH release tarballs
        run: pnpm run release:pack --family clawdsh --out dist/npm-clawdsh

      # The installed-consumer check is registry-independent: workspace peers
      # are supplied as tarballs but are never uploaded by this workflow.
      - name: Pack Harness peers for verification
        run: pnpm run release:pack --family dsh --out dist/npm-dsh

      - name: Pack vendored peers for verification
        run: pnpm run release:pack --family vendor --out dist/npm-vendor

      - name: Pack the Landlock entry for verification
        run: |
          pnpm --dir native/landlock-run run build:ts
          pnpm --dir native/landlock-run/packages/entry pack --pack-destination "$PWD/dist/npm-landlock"

      - name: Verify a fresh packed install
        run: >-
          pnpm run release:verify-packed-install --family clawdsh
          --from dist/npm-clawdsh
          --from dist/npm-dsh
          --from dist/npm-vendor
          --from dist/npm-landlock

      - uses: actions/upload-artifact@v4
        with:
          name: clawdsh-npm-tarballs
          path: dist/npm-clawdsh/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish verified tarballs to the private registry
    if: inputs.publish
    needs: pack
    runs-on: ubuntu-24.04
    environment: npm-publish
    concurrency:
      group: ClawDSH-private-registry-publish
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      # Keep release-tool installation on the ordinary dependency registry. The
      # protected target and its token are configured only after repository
      # dependencies are installed and all local publication gates have passed.
      - name: Install release scripts only
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
        run: pnpm install --frozen-lockfile --ignore-scripts

      - uses: actions/download-artifact@v4
        with:
          name: clawdsh-npm-tarballs
          path: dist/npm-clawdsh

      - name: Re-verify publish gates and protected private registry
        env:
          RELEASE_PUBLISH: 'true'
          TARGET_REGISTRY: ${{ vars.NPM_REGISTRY_URL }}
        run: pnpm run release:verify --family clawdsh --registry "$TARGET_REGISTRY"

      - name: Configure authenticated private registry
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          registry-url: ${{ vars.NPM_REGISTRY_URL }}
          always-auth: true

      # Only the nine ClawDSH tarballs are local here. Harness, Cordis, and
      # other prerequisites must resolve from the actual target registry.
      - name: Verify target-registry fresh install
        env:
          NPM_CONFIG_REGISTRY: ${{ vars.NPM_REGISTRY_URL }}
          # Read-only credential: installed dependency code never receives the
          # write-capable publication token used by the final step.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_READ_TOKEN }}
        run: >-
          pnpm run release:verify-packed-install --family clawdsh
          --from dist/npm-clawdsh

      - name: Publish the exact verified tarballs
        env:
          NPM_CONFIG_REGISTRY: ${{ vars.NPM_REGISTRY_URL }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm run release:publish --family clawdsh --from dist/npm-clawdsh
