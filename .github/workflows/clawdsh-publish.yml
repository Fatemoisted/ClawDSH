# ClawDSH public npm release preparation. Public writes require every readiness confirmation.
name: clawdsh-publish

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the verified tarballs to public npm; false performs the complete dry run only'
        required: true
        type: boolean
        default: false
      scope_ownership_confirmed:
        description: '@clawdsh npm scope ownership has been confirmed'
        required: true
        type: boolean
        default: false
      trusted_publishing_confirmed:
        description: 'npm trusted publishing is configured for this workflow and environment'
        required: true
        type: boolean
        default: false
      public_repository_approved:
        description: 'The user explicitly approved making the source repository public'
        required: true
        type: boolean
        default: false
      rc6_compatibility_confirmed:
        description: '@deepseek-ai/dsh@0.1.0-rc.6 compatibility is approved after the clean-install smoke'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: clawdsh-public-npm
  cancel-in-progress: false

env:
  NODE_OPTIONS: --max-old-space-size=4096
  CLAWDSH_RELEASE_ORDER: '@clawdsh/dsh-activity,@clawdsh/dsh-channel,@clawdsh/dsh-embeddings,@clawdsh/dsh-automation,@clawdsh/dsh-skills-hub,@clawdsh/dsh-soul,@clawdsh/dsh-channel-agent,@clawdsh/dsh-channel-openclaw,@clawdsh/dsh-embeddings-ark,@clawdsh/dsh-memory,@clawdsh/dsh-preset-messaging-safe,@clawdsh/dsh-bundle,@clawdsh/cli'

jobs:
  prepare:
    runs-on: ubuntu-latest
    env:
      CLAWDSH_RELEASE_DIRECTORY: ${{ runner.temp }}/clawdsh-release
      CLAWDSH_BUNDLE_DIRECTORY: ${{ runner.temp }}/clawdsh-stage/bundle
      CLAWDSH_REGISTRY_URL: http://127.0.0.1:4873/
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
          cache: pnpm

      - name: Require npm trusted-publishing support
        run: node -e "const [major,minor]=process.argv[1].split('.').map(Number); if (major < 11 || (major === 11 && minor < 5)) throw new Error('npm 11.5.1 or newer is required')" "$(npm --version)"

      - name: Install source dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck and build source packages
        run: |
          pnpm run typecheck
          pnpm run build

      - name: Install locked OpenClaw runtime
        run: npx --yes npm@10.9.7 ci --ignore-scripts --prefix packages/openclaw/channel-openclaw/runtime

      - name: Assembled OpenClaw Gateway smoke
        run: |
          artifact_dir="$RUNNER_TEMP/clawdsh-openclaw-artifact"
          mkdir -p "$artifact_dir"
          npx --yes npm@10.9.7 pack --silent --ignore-scripts --pack-destination "$artifact_dir" openclaw@2026.7.1-2 >/dev/null
          pnpm exec tsx packages/openclaw/channel-openclaw/tests/assembled-smoke.ts "$artifact_dir/openclaw-2026.7.1-2.tgz"

      - name: Build the nested product shell
        run: |
          pnpm --dir packages/openclaw/preset-openclaw/product-shell install --frozen-lockfile
          pnpm --dir packages/openclaw/preset-openclaw/product-shell run typecheck
          pnpm --dir packages/openclaw/preset-openclaw/product-shell run build

      - name: Verify release tools and the nested CLI without registry resolution
        run: |
          node --test packages/openclaw/preset-openclaw/distribution/release-tools/*.test.mjs
          node --test packages/openclaw/preset-openclaw/distribution/cli/tests/*.test.mjs
          pnpm exec tsc --noEmit -p packages/openclaw/preset-openclaw/distribution/cli/tsconfig.json

      - name: Stage, pack, and inspect exactly 13 packages
        run: |
          mkdir -p "$(dirname "$CLAWDSH_BUNDLE_DIRECTORY")"
          node packages/openclaw/preset-openclaw/distribution/release-tools/bundle-stage.mjs \
            --repo-root "$GITHUB_WORKSPACE" \
            --out "$CLAWDSH_BUNDLE_DIRECTORY"
          node packages/openclaw/preset-openclaw/distribution/release-tools/release-pack.mjs \
            --repository-root "$GITHUB_WORKSPACE" \
            --bundle-directory "$CLAWDSH_BUNDLE_DIRECTORY" \
            --output "$CLAWDSH_RELEASE_DIRECTORY"
          node packages/openclaw/preset-openclaw/distribution/release-tools/release-verify.mjs \
            "$CLAWDSH_RELEASE_DIRECTORY"

      - name: Clean install through a temporary registry
        run: |
          REGISTRY_ROOT="$RUNNER_TEMP/clawdsh-registry"
          REGISTRY_CONFIG="$RUNNER_TEMP/clawdsh-registry.json"
          node packages/openclaw/preset-openclaw/distribution/release-tools/temporary-registry-config.mjs \
            --output "$REGISTRY_CONFIG" \
            --state "$REGISTRY_ROOT"
          pnpm dlx verdaccio@6.2.2 \
            --config "$REGISTRY_CONFIG" \
            --listen 127.0.0.1:4873 \
            >"$RUNNER_TEMP/clawdsh-registry.log" 2>&1 &
          REGISTRY_PID=$!
          trap 'kill "$REGISTRY_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent "$CLAWDSH_REGISTRY_URL/-/ping" >/dev/null; then break; fi
            if [[ "$attempt" = 60 ]]; then
              cat "$RUNNER_TEMP/clawdsh-registry.log"
              exit 1
            fi
            sleep 1
          done
          LOCAL_NPMRC="$RUNNER_TEMP/clawdsh-registry.npmrc"
          node packages/openclaw/preset-openclaw/distribution/release-tools/temporary-registry-user.mjs \
            --registry "$CLAWDSH_REGISTRY_URL" \
            --output "$LOCAL_NPMRC"
          NPM_CONFIG_USERCONFIG="$LOCAL_NPMRC" node packages/openclaw/preset-openclaw/distribution/release-tools/publish-release.mjs \
            --directory "$CLAWDSH_RELEASE_DIRECTORY" \
            --registry "$CLAWDSH_REGISTRY_URL" \
            --order "$CLAWDSH_RELEASE_ORDER" \
            --tag next \
            --allow-loopback
          node packages/openclaw/preset-openclaw/distribution/release-tools/clean-install-smoke.mjs \
            --release-directory "$CLAWDSH_RELEASE_DIRECTORY" \
            --registry "$CLAWDSH_REGISTRY_URL" \
            --work-directory "$RUNNER_TEMP/clawdsh-clean-install" \
            --attestation "$CLAWDSH_RELEASE_DIRECTORY/smoke-attestation.json"

      - name: Confirm dry-run or requested public-release authority
        env:
          CLAWDSH_PUBLISH_REQUESTED: ${{ inputs.publish }}
          CLAWDSH_GITHUB_REF: ${{ github.ref }}
          CLAWDSH_REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
          CLAWDSH_SCOPE_OWNERSHIP_CONFIRMED: ${{ inputs.scope_ownership_confirmed }}
          CLAWDSH_TRUSTED_PUBLISHING_CONFIRMED: ${{ inputs.trusted_publishing_confirmed }}
          CLAWDSH_PUBLIC_REPOSITORY_APPROVED: ${{ inputs.public_repository_approved }}
          CLAWDSH_RC6_COMPATIBILITY_CONFIRMED: ${{ inputs.rc6_compatibility_confirmed }}
          CLAWDSH_RELEASE_INDEX: ${{ runner.temp }}/clawdsh-release/release-index.json
          CLAWDSH_SMOKE_ATTESTATION: ${{ runner.temp }}/clawdsh-release/smoke-attestation.json
        run: node packages/openclaw/preset-openclaw/distribution/release-tools/release-readiness.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: clawdsh-public-npm-candidate
          path: ${{ runner.temp }}/clawdsh-release
          if-no-files-found: error
          retention-days: 7

  publish:
    if: ${{ inputs.publish && github.ref == 'refs/heads/clawdsh' }}
    needs: prepare
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - uses: actions/download-artifact@v4
        with:
          name: clawdsh-public-npm-candidate
          path: ${{ runner.temp }}/clawdsh-release

      - name: Recheck release authority and smoke evidence
        env:
          CLAWDSH_PUBLISH_REQUESTED: 'true'
          CLAWDSH_GITHUB_REF: ${{ github.ref }}
          CLAWDSH_REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
          CLAWDSH_SCOPE_OWNERSHIP_CONFIRMED: ${{ inputs.scope_ownership_confirmed }}
          CLAWDSH_TRUSTED_PUBLISHING_CONFIRMED: ${{ inputs.trusted_publishing_confirmed }}
          CLAWDSH_PUBLIC_REPOSITORY_APPROVED: ${{ inputs.public_repository_approved }}
          CLAWDSH_RC6_COMPATIBILITY_CONFIRMED: ${{ inputs.rc6_compatibility_confirmed }}
          CLAWDSH_RELEASE_INDEX: ${{ runner.temp }}/clawdsh-release/release-index.json
          CLAWDSH_SMOKE_ATTESTATION: ${{ runner.temp }}/clawdsh-release/smoke-attestation.json
        run: |
          node packages/openclaw/preset-openclaw/distribution/release-tools/release-readiness.mjs
          node packages/openclaw/preset-openclaw/distribution/release-tools/release-verify.mjs \
            "$RUNNER_TEMP/clawdsh-release"

      - name: Publish dependency-first to public npm next with provenance
        run: |
          node packages/openclaw/preset-openclaw/distribution/release-tools/publish-release.mjs \
            --directory "$RUNNER_TEMP/clawdsh-release" \
            --registry https://registry.npmjs.org/ \
            --order "$CLAWDSH_RELEASE_ORDER" \
            --tag next \
            --provenance
