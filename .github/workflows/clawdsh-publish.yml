# ClawDSH 私有 registry 发布工作流（本仓库自有；上游 release 工作流一律不动）
# 手动触发：inputs.registry 指定私有 registry URL，dry-run 只校验 tarball 不落盘。
name: clawdsh-publish

on:
  workflow_dispatch:
    inputs:
      registry:
        description: 'Private npm registry URL (e.g. https://npm.example.com/)'
        required: true
        type: string
      dry-run:
        description: 'Pack and validate tarballs without publishing'
        required: false
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Typecheck
        run: pnpm run typecheck

      - name: ClawDSH communication-plane gates
        run: |
          npm ci --ignore-scripts --prefix packages/openclaw/channel-openclaw/runtime
          pnpm exec vitest run packages/openclaw/channel/tests packages/openclaw/channel-agent/tests packages/openclaw/channel-openclaw/tests packages/openclaw/preset-clawdsh-messaging-safe/tests
          node --test packages/openclaw/channel-openclaw/bridge/test/*.test.mjs
          node packages/openclaw/channel-openclaw/bridge/verify.mjs
          pnpm exec vitest run --config tools/openclaw-channel-host/vitest.config.ts
          pnpm exec tsc -p tools/openclaw-channel-host/tsconfig.json --noEmit
          pnpm exec tsx tools/openclaw-channel-host/verify.ts --check --host-root packages/openclaw/channel-openclaw/runtime/node_modules/openclaw
          pnpm exec tsx tools/openclaw-channel-host/generate-parity.ts --check
          pnpm exec vitest run --config tools/openclaw-channel-migration.vitest.config.ts
          pnpm run verify-translation-pairing

      - name: Publish (dry-run)
        if: ${{ inputs.dry-run }}
        env:
          NPM_CONFIG_REGISTRY: ${{ inputs.registry }}
        run: >-
          pnpm -r --filter './packages/openclaw/*'
          --filter '!@clawdsh/dsh-channel-core'
          --filter '!@clawdsh/dsh-channel-telegram'
          --filter '!@clawdsh/dsh-channel-feishu'
          publish --dry-run --no-git-checks

      - name: Publish
        if: ${{ !inputs.dry-run }}
        env:
          NPM_CONFIG_REGISTRY: ${{ inputs.registry }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: >-
          pnpm -r --filter './packages/openclaw/*'
          --filter '!@clawdsh/dsh-channel-core'
          --filter '!@clawdsh/dsh-channel-telegram'
          --filter '!@clawdsh/dsh-channel-feishu'
          publish --no-git-checks
