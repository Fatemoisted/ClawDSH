# ClawDSH 冒烟工作流（本仓库自有；上游 CI 文件一律不动）
# ClawDSH 自有代码、profile、通信平面与真实浏览器入口的独立门禁。
name: clawdsh-smoke

on:
  workflow_dispatch:
  pull_request:
    branches: [clawdsh]
    paths:
      - '.github/workflows/clawdsh-smoke.yml'
      - 'packages/openclaw/**'
      - 'tools/**'
  push:
    branches: [clawdsh]

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Install ClawDSH product shell
        run: pnpm --dir packages/openclaw/preset-openclaw/product-shell install --frozen-lockfile

      - name: ClawDSH product shell
        run: |
          pnpm --dir packages/openclaw/preset-openclaw/product-shell run typecheck
          pnpm --dir packages/openclaw/preset-openclaw/product-shell run test
          pnpm --dir packages/openclaw/preset-openclaw/product-shell run build

      - name: ClawDSH identity contracts
        run: pnpm exec vitest run --config packages/openclaw/preset-openclaw/gui-tests/vitest.gui.config.ts packages/openclaw/preset-openclaw/gui-tests/identity.spec.ts

      - name: ClawDSH browser typecheck
        run: pnpm exec tsc -p packages/openclaw/preset-openclaw/gui-tests/tsconfig.real-profile.json

      - name: Install Chromium
        run: pnpm --filter @deepseek-ai/dsh-web-frontend exec playwright install --with-deps chromium

      - name: ClawDSH real-profile browser snapshot
        env:
          DSH_SNAPSHOT: replay
        run: pnpm exec vitest run --config packages/openclaw/preset-openclaw/gui-tests/vitest.gui.config.ts packages/openclaw/preset-openclaw/gui-tests/real-profile.e2e.ts

      - name: ClawDSH communication-plane gates
        run: |
          npm ci --ignore-scripts --prefix packages/openclaw/channel-openclaw/runtime
          pnpm exec vitest run packages/openclaw/channel/tests packages/openclaw/channel-agent/tests packages/openclaw/channel-openclaw/tests packages/openclaw/preset-clawdsh-messaging-safe/tests
          node --test packages/openclaw/channel-openclaw/bridge/test/*.test.mjs
          node packages/openclaw/channel-openclaw/bridge/verify.mjs
          pnpm exec vitest run --config tools/openclaw-channel-host/vitest.config.ts
          pnpm exec tsc -p tools/openclaw-channel-host/tsconfig.json --noEmit
          pnpm exec tsx tools/openclaw-channel-host/verify.ts --check --host-root packages/openclaw/channel-openclaw/runtime/node_modules/openclaw
          pnpm exec tsx tools/openclaw-channel-host/generate-parity.ts --check
          pnpm exec vitest run --config tools/openclaw-channel-migration.vitest.config.ts
          pnpm run verify-translation-pairing
