# ClawDSH 冒烟工作流（本仓库自有；上游 CI 文件一律不动）
# 阶段 0 只做安装+typecheck；阶段 2 起追加 profile 冒烟与契约测试。
name: clawdsh-smoke

on:
  workflow_dispatch:
  pull_request:
    branches: [clawdsh]
  push:
    branches: [clawdsh]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Typecheck openclaw tests
        run: pnpm exec tsc -p packages/openclaw/tsconfig.check.json

      - name: Test openclaw packages
        run: pnpm run test:openclaw

      - name: Smoke-test profile installation
        env:
          DSH_HOME: ${{ runner.temp }}/clawdsh-home
        run: bash tools/link-openclaw.sh

      - name: Resolve installed profile
        env:
          DSH_HOME: ${{ runner.temp }}/clawdsh-home
          # `--dump-config` does not dial Feishu, but the enabled adapter's
          # required schema still validates its environment-backed fields.
          FEISHU_APP_ID: cli-smoke-app
          FEISHU_APP_SECRET: cli-smoke-secret
        run: pnpm dsh --profile openclaw --dump-config
