# ClawDSH 冒烟工作流（本仓库自有；上游 CI 文件一律不动）
# ClawDSH 自有代码、profile 与真实浏览器入口的独立门禁。
name: clawdsh-smoke

on:
  workflow_dispatch:
  pull_request:
    branches: [clawdsh]
    paths:
      - '.github/workflows/clawdsh-smoke.yml'
      - 'packages/openclaw/**'
      - 'tools/**'
  push:
    branches: [clawdsh]

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Typecheck openclaw tests
        run: pnpm exec tsc -p packages/openclaw/tsconfig.check.json

      - name: Test openclaw packages
        run: pnpm run test:openclaw

      - name: Build
        run: pnpm run build

      - name: ClawDSH identity contracts
        run: pnpm exec vitest run --config tools/openclaw-preset-openclaw/gui-tests/vitest.gui.config.ts tools/openclaw-preset-openclaw/gui-tests/identity.spec.ts

      - name: ClawDSH browser typecheck
        run: pnpm exec tsc -p tools/openclaw-preset-openclaw/gui-tests/tsconfig.real-profile.json

      - name: Install Chromium
        run: pnpm --filter @deepseek-ai/dsh-web-frontend exec playwright install --with-deps chromium

      - name: ClawDSH real-profile browser snapshot
        env:
          DSH_SNAPSHOT: replay
        run: pnpm exec vitest run --config tools/openclaw-preset-openclaw/gui-tests/vitest.gui.config.ts tools/openclaw-preset-openclaw/gui-tests/real-profile.e2e.ts

      - name: Smoke-test profile installation
        env:
          DSH_HOME: ${{ runner.temp }}/clawdsh-home
          CLAWDSH_SKIP_BUILD: '1'
        run: bash tools/link-clawdsh.sh

      - name: Resolve installed profile
        env:
          DSH_HOME: ${{ runner.temp }}/clawdsh-home
        run: pnpm dsh --profile clawdsh --dump-config
