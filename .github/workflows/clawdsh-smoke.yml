# ClawDSH 冒烟工作流（本仓库自有；上游 CI 文件一律不动）
# 阶段 0 只做安装+typecheck；阶段 2 起追加 profile 冒烟与契约测试。
name: clawdsh-smoke

on:
  workflow_dispatch:
  push:
    branches: [clawdsh]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck
